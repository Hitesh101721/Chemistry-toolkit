<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemistry Toolkit</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    margin: 0;
    padding: 30px 20px;
    text-align: center;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.subtitle {
    color: #94a3b8;
    margin-bottom: 30px;
}

.card {
    background: #1e293b;
    padding: 30px;
    border-radius: 25px;
    text-align: left;
}

label {
    display: block;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

input, select {
    width: 100%;
    box-sizing: border-box;
    padding: 18px;
    margin-bottom: 25px;
    border-radius: 15px;
    border: 1px solid #475569;
    background: #0f172a;
    color: white;
    font-size: 17px;
}

button {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 15px;
    background: #22c55e;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #16a34a;
}

#result {
    margin-top: 30px;
}

.step {
    background: #1e293b;
    margin-top: 15px;
    padding: 20px;
    border-radius: 15px;
    text-align: left;
    border-left: 4px solid #22c55e;
}

.step h3 {
    margin-top: 0;
    color: #86efac;
}

.important {
    color: #facc15;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

    <h1>🧪 Chemistry Toolkit</h1>

    <div class="subtitle">
        Organic Chemistry Mechanism Generator
    </div>

    <div class="card">

        <label>Enter Reaction</label>

        <input
            id="reaction"
            type="text"
            placeholder="Example: Acetone + HCN"
        >

        <label>Select Mechanism</label>

        <select id="mechanism">

            <option value="addition">
                Nucleophilic Addition
            </option>

            <option value="sn1">
                SN1
            </option>

            <option value="sn2">
                SN2
            </option>

            <option value="aldol">
                Aldol Condensation
            </option>

            <option value="e1">
                E1
            </option>

            <option value="e2">
                E2
            </option>

        </select>

        <button onclick="generateMechanism()">
            Generate Mechanism
        </button>

    </div>

    <div id="result"></div>

</div>

<script>

function generateMechanism() {

    const reaction =
        document.getElementById("reaction").value.trim();

    const mechanism =
        document.getElementById("mechanism").value;

    const result =
        document.getElementById("result");

    if (reaction === "") {

        result.innerHTML = `
            <div class="step">
                <h3>⚠️ Enter a reaction</h3>
                <p>Example: Acetone + HCN</p>
            </div>
        `;

        return;
    }

    if (
        mechanism === "addition" &&
        reaction.toLowerCase().includes("acetone") &&
        reaction.toLowerCase().includes("hcn")
    ) {

        result.innerHTML = `

        <div class="step">

            <h3>Step 1 — Nucleophilic Attack</h3>

            <p>
            HCN provides the nucleophile
            <span class="important">CN⁻</span>.
            </p>

            <p>
            The cyanide ion attacks the
            electrophilic carbon of the carbonyl group
            (C=O) in acetone.
            </p>

            <p>
            At the same time, the
            <span class="important">π electrons of C=O move toward oxygen.</span>
            </p>

        </div>

        <div class="step">

            <h3>Step 2 — Tetrahedral Intermediate</h3>

            <p>
            After nucleophilic attack, the carbonyl carbon
            becomes tetrahedral.
            </p>

            <p>
            Oxygen now carries a
            <span class="important">negative charge (O⁻)</span>.
            </p>

            <p>
            The newly formed C–CN bond remains attached
            to the former carbonyl carbon.
            </p>

        </div>

        <div class="step">

            <h3>Step 3 — Protonation</h3>

            <p>
            The negatively charged oxygen is protonated
            by HCN.
            </p>

            <p>
            This produces the final
            <span class="important">cyanohydrin</span>.
            </p>

            <p>
            <strong>Product:</strong>
            Acetone cyanohydrin
            </p>

        </div>

        `;

    } else {

        result.innerHTML = `

        <div class="step">

            <h3>🧪 Mechanism Selected</h3>

            <p>
            Reaction:
            <strong>${reaction}</strong>
            </p>

            <p>
            Mechanism:
            <strong>${mechanism}</strong>
            </p>

            <p>
            Detailed mechanism for this reaction
            will be added in the next development phase.
            </p>

        </div>

        `;

    }
}

</script>

</body>
</html>
