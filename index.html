<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Chemistry Toolkit</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    margin: 0;
    padding: 25px 15px;
    text-align: center;
}

.container {
    max-width: 750px;
    margin: auto;
}

h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.subtitle {
    color: #94a3b8;
    margin-bottom: 30px;
}

.card {
    background: #1e293b;
    padding: 25px;
    border-radius: 25px;
    text-align: left;
}

label {
    display: block;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

input,
select {

    width: 100%;
    box-sizing: border-box;

    padding: 17px;

    margin-bottom: 22px;

    border-radius: 14px;

    border: 1px solid #475569;

    background: #0f172a;

    color: white;

    font-size: 17px;
}

button {

    width: 100%;

    padding: 17px;

    border: none;

    border-radius: 14px;

    background: #22c55e;

    color: white;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #16a34a;
}

#result {
    margin-top: 30px;
}

.step {

    background: #1e293b;

    padding: 20px;

    border-radius: 20px;

    border-left: 4px solid #22c55e;
}

.step-title {

    color: #86efac;

    font-size: 22px;

    margin-bottom: 10px;
}

.explanation {

    color: #cbd5e1;

    line-height: 1.6;

    text-align: left;

    margin-top: 15px;
}

.diagram {

    background: #020617;

    border-radius: 18px;

    padding: 10px;

    margin-top: 15px;

    overflow-x: auto;
}

.diagram svg {

    width: 100%;

    min-width: 320px;

    height: 260px;
}

.atom {
    font-size: 24px;
    font-weight: bold;
    fill: white;
}

.charge {
    font-size: 18px;
    font-weight: bold;
    fill: white;
}
.charge {

    font-size: 18px;

    font-weight: bold;
}

.arrow {

    stroke: #38bdf8;

    stroke-width: 4;

    fill: none;
}

.bond {

    stroke: white;

    stroke-width: 4;
}

.dashed {

    stroke: #94a3b8;

    stroke-width: 3;

    stroke-dasharray: 8 7;
}

.navigation {

    display: flex;

    gap: 12px;

    margin-top: 20px;
}

.navigation button {

    flex: 1;

    background: #334155;
}

.navigation button:hover {

    background: #475569;
}

.counter {

    color: #94a3b8;

    margin-top: 12px;

    font-size: 14px;
}

.important {

    color: #facc15;

    font-weight: bold;
}

</style>

</head>


<body>


<div class="container">


<h1>🧪 Chemistry Toolkit</h1>

<div class="subtitle">
Organic Chemistry Mechanism Generator
</div>


<div class="card">


<label>
Enter Reaction
</label>


<input
id="reaction"
type="text"
placeholder="Example: Acetone + HCN"
>


<label>
Select Mechanism
</label>


<select id="mechanism">

<option value="addition">
Nucleophilic Addition
</option>

<option value="sn1">
SN1
</option>

<option value="sn2">
SN2
</option>

<option value="aldol">
Aldol Condensation
</option>

<option value="e1">
E1
</option>

<option value="e2">
E2
</option>

</select>


<button onclick="generateMechanism()">

Generate Mechanism

</button>


</div>


<div id="result"></div>


</div>



<script>


let currentStep = 0;


const steps = [

{

title: "Step 1 — Nucleophilic Attack",

diagram: `

<svg viewBox="0 0 600 260">


<!-- carbonyl carbon -->

<text x="275" y="125"
class="atom">
C
</text>


<!-- oxygen -->

<text x="275" y="55"
class="atom">
O
</text>


<!-- C=O double bond -->

<line
x1="290"
y1="90"
x2="290"
y2="70"
class="bond"
/>

<line
x1="305"
y1="90"
x2="305"
y2="70"
class="bond"
/>


<!-- methyl groups -->

<text x="165" y="130"
class="atom">
CH₃
</text>

<text x="350" y="130"
class="atom">
CH₃
</text>


<line
x1="215"
y1="120"
x2="260"
y2="120"
class="bond"
/>

<line
x1="325"
y1="120"
x2="345"
y2="120"
class="bond"
/>


<!-- cyanide -->

<text x="95" y="225"
class="atom">
CN⁻
</text>


<!-- cyanide attack arrow -->

<path
d="M 130 205 Q 190 160 250 130"
class="arrow"
/>


<polygon
points="250,130 238,126 242,140"
fill="#38bdf8"
/>


<!-- pi electron arrow -->

<path
d="M 300 75 Q 315 58 290 55"
class="arrow"
/>

<polygon
points="290,55 303,52 298,64"
fill="#38bdf8"
/>

<text x="55" y="250"
fill="#38bdf8"
font-size="15">
CN⁻ attacks carbonyl carbon
</text>


</svg>
`,

explanation: `

The cyanide ion (CN⁻) acts as the
<strong>nucleophile</strong>.

It attacks the electrophilic carbon
of the carbonyl group.

At the same time, the
<strong>π electrons of C=O move onto oxygen.</strong>

This is a nucleophilic addition reaction.

`

},


{

title: "Step 2 — Tetrahedral Intermediate",

diagram: `

<svg viewBox="0 0 600 260">


<!-- central carbon -->

<text x="275" y="130"
class="atom">
C
</text>


<!-- oxygen -->

<text x="275" y="55"
class="atom">
O⁻
</text>


<!-- vertical bond -->

<line
x1="290"
y1="105"
x2="290"
y2="70"
class="bond"
/>


<!-- methyl -->

<text x="150" y="135"
class="atom">
CH₃
</text>


<line
x1="200"
y1="125"
x2="260"
y2="125"
class="bond"
/>


<!-- methyl -->

<text x="350" y="135"
class="atom">
CH₃
</text>


<line
x1="325"
y1="125"
x2="345"
y2="125"
class="bond"
/>


<!-- CN -->

<text x="270" y="220"
class="atom">
CN
</text>


<line
x1="290"
y1="150"
x2="290"
y2="205"
class="bond"
/>


<text x="155" y="250"
fill="#facc15"
font-size="16">

Oxygen now carries a negative charge

</text>


</svg>
`,

explanation: `

After CN⁻ attack, the carbonyl carbon
becomes <strong>tetrahedral</strong>.

The C=O double bond has become a
single C–O bond.

Oxygen now carries a
<strong>negative charge (O⁻)</strong>.

A new C–CN bond has formed.

`

},


{

title: "Step 3 — Protonation",

diagram: `


<svg viewBox="0 0 600 300">

<!-- Product: central carbon -->
<text x="275" y="145" class="atom">C</text>

<!-- OH -->
<text x="268" y="65" class="atom">OH</text>

<line x1="290" y1="115" x2="290" y2="80" class="bond"/>

<text x="135" y="150" class="atom">CH₃</text>
<line x1="185" y1="140" x2="260" y2="140" class="bond"/>

<text x="365" y="150" class="atom">CH₃</text>
<line x1="325" y1="140" x2="355" y2="140" class="bond"/>

<text x="270" y="235" class="atom">CN</text>
<line x1="290" y1="165" x2="290" y2="220" class="bond"/>

<!-- HCN -->
<text x="450" y="65" class="atom">H–C≡N</text>

<!-- O⁻ → H -->
<path d="M 330 95 Q 380 65 435 65" class="arrow"/>

<polygon
points="435,65 422,59 424,72"
fill="#38bdf8"/>

<!-- H–C bond → CN -->
<path d="M 455 80 Q 430 115 405 130" class="arrow"/>

<polygon
points="405,130 418,128 412,118"
fill="#38bdf8"/>

<text x="345" y="45" fill="#38bdf8" font-size="15">
O⁻ attacks H
</text>

<text x="375" y="155" fill="#38bdf8" font-size="15">
H–CN electrons → CN⁻
</text>

</svg>
`,


<!-- carbon -->

<text x="275" y="135"
class="atom">
C
</text>


<!-- OH -->

<text x="270" y="55"
class="atom">
OH
</text>


<line
x1="290"
y1="105"
x2="290"
y2="70"
class="bond"
/>


<!-- methyl -->

<text x="150" y="140"
class="atom">
CH₃
</text>


<line
x1="200"
y1="130"
x2="260"
y2="130"
class="bond"
/>


<!-- methyl -->

<text x="350" y="140"
class="atom">
CH₃
</text>


<line
x1="325"
y1="130"
x2="345"
y2="130"
class="bond"
/>


<!-- CN -->

<text x="270" y="220"
class="atom">
CN
</text>


<line
x1="290"
y1="155"
x2="290"
y2="205"
class="bond"
/>


<!-- proton -->

<text x="440" y="55"
class="atom">
H
</text>


<!-- protonation arrow -->

<path
d="M 400 70 Q 360 75 325 70"
class="arrow"
/>


<polygon
points="325,70 337,65 335,78"
fill="#38bdf8"
/>


<text x="375" y="105"
fill="#38bdf8"
font-size="15">

Protonation

</text>


</svg>
`,

explanation: `

The negatively charged oxygen is
<strong>protonated</strong>.

The proton comes from HCN.

The final product is
<strong>acetone cyanohydrin</strong>.

The overall transformation is:

<strong>Acetone + HCN → Acetone cyanohydrin</strong>

`

}

];


function generateMechanism() {


const reaction =
document
.getElementById("reaction")
.value
.trim();


const mechanism =
document
.getElementById("mechanism")
.value;


if (reaction === "") {

document.getElementById("result").innerHTML = `

<div class="step">

<div class="step-title">
⚠️ Enter a reaction
</div>

<p>
Example: Acetone + HCN
</p>

</div>

`;

return;

}


if (

mechanism === "addition" &&

reaction
.toLowerCase()
.includes("acetone") &&

reaction
.toLowerCase()
.includes("hcn")

) {

currentStep = 0;

showStep();

}

else {

document.getElementById("result").innerHTML = `

<div class="step">

<div class="step-title">
🧪 Mechanism Selected
</div>

<p>
Reaction:
<strong>${reaction}</strong>
</p>

<p>
This mechanism will be added
in the next development phase.
</p>

</div>

`;

}

}


function showStep() {


const step = steps[currentStep];


document.getElementById("result").innerHTML = `

<div class="step">

<div class="step-title">

${step.title}

</div>


<div class="diagram">

${step.diagram}

</div>


<div class="explanation">

${step.explanation}

</div>


<div class="navigation">

<button
onclick="previousStep()"
${currentStep === 0 ? "disabled" : ""}>
← Previous
</button>


<button
onclick="nextStep()"
${currentStep === steps.length - 1 ? "disabled" : ""}>
Next →
</button>

</div>


<div class="counter">

Step ${currentStep + 1} of ${steps.length}

</div>

</div>

`;

}


function nextStep() {

if (currentStep < steps.length - 1) {

currentStep++;

showStep();

}

}


function previousStep() {

if (currentStep > 0) {

currentStep--;

showStep();

}

}


</script>


</body>

</html>
